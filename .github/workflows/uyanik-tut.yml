name: Veritabanini uyanik tut

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          url=$(sed -n "s/.*SUPABASE_URL = '\(.*\)';/\1/p" src/backend.js)
          key=$(sed -n "s/.*SUPABASE_KEY = '\(.*\)';/\1/p" src/backend.js)
          curl -fsS -X POST "$url/rest/v1/rpc/ping" -H "apikey: $key" -H 'Content-Type: application/json' -d '{}'
