[package]
name = "tugba-kuponlar"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "tugba-kuponlar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
